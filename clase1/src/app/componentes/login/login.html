<p>iniciar sesion</p>

<input type="string" [(ngModel)]="usuarioIngresado" name="usuarioIngresado"/><br>

<input type="password" [(ngModel)]="passwordIngresado" name="passwordIngresado"/><br>

<button (click)="login()">Iniciar sesion</button>



@if (intentoAprobado) {
  <h1>bienvenido</h1>
} @else {
  <h1>usuario no registrado</h1>
}
